<title>AGENTIC-ARBITER — free-cooling decisions, hour by hour</title>

<!-- INTER IS PRELOADED, and the reason is the render gate rather than perceived speed.
     The canvas panels make 40 fillText calls. If a first render draws in the fallback face and a
     second draws in Inter, every text pixel differs, and testing/verify_site_panels.py requires two
     renders of one site to be byte-identical. Preload plus `font-display: block` in the @font-face
     rules means neither render can catch the fallback. See src/index.css. -->
<link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>

<!-- THE THEME IS RESOLVED BEFORE THE FIRST PAINT, exactly as the single-file page does it. In the
     main bundle this would run after parse, painting light and repainting dark: a white flash on
     every load. Dark is the default, not a fallback to the system preference. -->
<script>
(function(){
  try{
    /* THE CHOICE IS READ PER STAGE GROUP, AND A DOCUMENT ALWAYS OPENS ON THE LANDING GROUP.
       So this needs exactly one lookup, `-pick`, and cannot be wrong about which screen it is
       resolving for. See the long note in App.tsx: a choice used to be global, which meant one press
       of the toggle on the configure screen silently pinned the landing page to light for good.
       ⚠ THE KEY NAMES ARE NEW ON PURPOSE. Every reader who has ever pressed the toggle carries
       `aa-theme-choice='1'` from the old scheme; reading a new name is what unsticks them once. The
       old pair is deliberately never read again, so it simply expires. */
    var chose = localStorage.getItem('aa-theme-choice-pick');
    var t = chose ? localStorage.getItem('aa-theme-pick') : 'dark';
    document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
  }catch(e){ document.documentElement.dataset.theme = 'dark'; }
})();
</script>

<!-- A RELOAD RETURNS THE READER TO THE LANDING PAGE, GLOBE AND SOUND AND ALL.
     The user: "whenever a user hard reloads (refreshes) the website ... they are automatically
     redirected back to the initial landing page ... while still allowing normal client-side
     navigation between pages when using the app's internal links or buttons."

     🔴 THERE IS NOTHING TO REDIRECT, AND THAT IS THE POINT. This app has no router: pick, configure
     and results are three states of ONE document, published as `body[data-stage]` and owned by the
     engine's `setStage()`. A fresh document already starts on 'pick', so the stage was never the
     thing that survived a refresh. What survived was `hasSeenSplash` in sessionStorage, which
     `flags.gateEnabled()` reads to skip the gate -- so a reload landed on the first screen with the
     globe, the wordmark and the audio all suppressed, which is what "it keeps you where you were"
     actually looked like.

     ⚠ THIS REVERSES AN EARLIER INSTRUCTION ON PURPOSE. The flag was added to a brief that asked for
     exactly the opposite: "set a flag (e.g. sessionStorage.setItem('hasSeenSplash','true'))" so that
     "a reload or a back-button press skips it". The key and the mechanism are kept; only the moment
     it is cleared is new. It is still sessionStorage, so it still does its other job untouched:
     within one document, passing the gate and then walking pick -> configure -> results -> pick does
     NOT bring the gate back, because nothing clears the flag between those transitions. There is no
     document load between them.

     Here rather than in the bundle, for the same reason as the theme block above it: `readFlags()`
     runs during React's first render, and a clear that happened after that would be a frame too
     late. -->
<script>
(function(){
  try{
    /* 🔴 BOTH MARKERS, AND CLEARING ONLY THE FIRST ONE BROKE THE SOUND.
       These two sessionStorage keys describe ONE fact between them: the reader has already been
       through the intro in this document. They were introduced together and, until 2026-08-30, they
       expired together, because nothing cleared either of them and a reload kept both.
       Then this script began clearing `hasSeenSplash` so a refresh returns to the globe. It did not
       clear `aa-intro-audio-played`, so the two disagreed: the gate came back, the reader pressed
       Initialize Arbiter, and `audio.ts:playVoice()` returned 0 on its first line because
       `alreadyPlayed()` was still true from the first visit of the session. A silent cinematic, on
       exactly the reload the same change had just made more likely. Reported as "i dont hear the
       music and the mp3 audio that triggers when the Initialise arbiter button is clicked".
       ⚠ THE KEY NAME IS TYPED TWICE, here and at audio.ts:PLAYED_KEY, because a pre-paint script in
       the document cannot import from the bundle. testing/verify_launch.py asserts the two strings
       match, so the copy cannot drift silently. */
    window.sessionStorage.removeItem('hasSeenSplash');
    window.sessionStorage.removeItem('aa-intro-audio-played');
  }catch(e){ /* private mode: the gate shows anyway, because gateEnabled() treats an unreadable
    store as "not seen", and playVoice() treats it the same way */ }
})();
</script>
