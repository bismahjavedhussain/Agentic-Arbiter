<title>AGENTIC-ARBITER — free-cooling decisions, hour by hour</title>

<!-- INTER IS PRELOADED, and the reason is the render gate rather than perceived speed.
     The canvas panels make 40 fillText calls. If a first render draws in the fallback face and a
     second draws in Inter, every text pixel differs, and testing/verify_site_panels.py requires two
     renders of one site to be byte-identical. Preload plus `font-display: block` in the @font-face
     rules means neither render can catch the fallback. See src/index.css. -->
<link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>

<!-- THE THEME IS RESOLVED BEFORE THE FIRST PAINT, exactly as the single-file page does it. In the
     main bundle this would run after parse, painting light and repainting dark: a white flash on
     every load. Dark is the default, not a fallback to the system preference. -->
<script>
(function(){
  try{
    var t = localStorage.getItem('aa-theme');
    document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
  }catch(e){ document.documentElement.dataset.theme = 'dark'; }
})();
</script>
  <script type="module" crossorigin src="./assets/index-Dii1dER4.js"></script>
